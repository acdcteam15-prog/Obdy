# Builds the debug APK when Rebuild-APK.bat asks for it (or when Remoty runs it). Nothing is published; the APK is attached to the run.
name: Build
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (OBD parsing, DTC decoding, formulas)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: |
          export BUILD_NUMBER=$(git rev-list --count HEAD)
          ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: obdy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7
