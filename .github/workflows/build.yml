# Builds the APK when Rebuild-APK.bat asks for it (or when Remoty runs it).
# The APK is attached to the run AND published as a GitHub Release, so the app can update itself (Settings > Updates).
name: Build
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          packages: platform-tools

      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (OBD parsing, DTC decoding, formulas)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: |
          export BUILD_NUMBER=$(git rev-list --count HEAD)
          ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: obdy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Name the APK for the in-app updater
        id: pack
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          OFFSET=$(grep '^versionCodeOffset=' version.properties | cut -d= -f2 | tr -d '\r')
          COUNT=$(git rev-list --count HEAD)
          CODE=$((OFFSET + COUNT))
          NAME="Obdy-${VERSION_NAME//./_}-build${CODE}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/$NAME"
          git log -1 --pretty='%s' > notes.md
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.pack.outputs.code }}
          name: Obdy ${{ steps.pack.outputs.version }} (build ${{ steps.pack.outputs.code }})
          body_path: notes.md
          files: dist/${{ steps.pack.outputs.name }}
          make_latest: true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7
