# Builds the release APK and publishes it as a GitHub Release. The in-app updater (Settings > Updates) reads it.
# Run: Publish-Update.bat, or Actions > Release > Run workflow.
# Signing: uses the 4 optional secrets if you set them; otherwise the fixed key in signing/ (so updates always install over the old version).
name: Release
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown on the release). Empty = commit list."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore (only if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: using the fixed key in signing/"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export BUILD_NUMBER=$(git rev-list --count HEAD)
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Name the APK
        id: pack
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          OFFSET=$(grep '^versionCodeOffset=' version.properties | cut -d= -f2 | tr -d '\r')
          COUNT=$(git rev-list --count HEAD)
          CODE=$((OFFSET + COUNT))
          NAME="Obdy-${VERSION_NAME//./_}-build${CODE}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "${INPUT_NOTES:-}" ]; then printf '%s\n' "$INPUT_NOTES" > notes.md
          else git log -20 --no-merges --pretty='- %s' > notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.pack.outputs.code }}
          name: Obdy ${{ steps.pack.outputs.version }} (build ${{ steps.pack.outputs.code }})
          body_path: notes.md
          files: dist/${{ steps.pack.outputs.name }}
          make_latest: true
